<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartNexa - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #d50000;
            font-weight: bold;
        }

        .logo p {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d50000;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #d50000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #b80000;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: #d50000;
        }

        .success {
            color: green;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }

        .register a {
            color: #d50000;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>CartNexa</h1>
        <p>Login to your account</p>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

</div>


<script>

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        message.innerText = "Logging in...";
        message.className = "message";

        try {

			const response = await fetch("http://localhost:8080/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {

                message.innerText = "Login successful!";
                message.className = "message success";

                // JWT token save
                if (data.token) {
                    localStorage.setItem("token", data.token);
                }

                // User ID save if returned
                if (data.userId) {
                    localStorage.setItem("userId", data.userId);
                }

                setTimeout(() => {
                    window.location.href = "http://localhost:9090/product/products.html";
                }, 1000);

            } else {

                message.innerText =
                    data.message || "Invalid email or password";

                message.className = "message error";
            }

        } catch (error) {

            console.error(error);

            message.innerText =
                "Unable to connect to server";

            message.className = "message error";
        }

    });

</script>

</body>
</html>
