
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CartNexa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .register-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">CartNexa</div>

    <div class="subtitle">
        Create your account
    </div>

    <form id="registerForm">

        <label for="uname">Name</label>
        <input
                type="text"
                id="uname"
                placeholder="Enter your name"
                required
        >

        <label for="emailId">Email</label>
        <input
                type="email"
                id="emailId"
                placeholder="Enter your email"
                required
        >

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
        >

        

        <button type="submit">
            Register
        </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="index.html">Login</a>
    </div>

</div>


<script>

    document.getElementById("registerForm").addEventListener("submit", async function (event) {

        event.preventDefault();

        const name = document.getElementById("uname").value;
        const email = document.getElementById("emailId").value;
        const password = document.getElementById("password").value;
       

        const message = document.getElementById("message");

        const userData = {
            name: name,
            email: email,
            password: password,
            
        };

        try {

            const response = await fetch(
                "http://localhost:8080/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(userData)
                }
            );

            const data = await response.text();

            if (response.ok) {

                message.style.color = "green";
                message.innerText = "Registration successful!";

                document.getElementById("registerForm").reset();

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } else {

                message.style.color = "red";
                message.innerText = data || "Registration failed.";

            }

        } catch (error) {

            console.error(error);

            message.style.color = "red";
            message.innerText =
                "Unable to connect with User Service.";

        }

    });

</script>

</body>
</html>
